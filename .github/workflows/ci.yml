name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest

    env:
      USE_MOCK_AI: "true"
      GEMINI_API_KEY: "mock"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_ai_engine/requirements.txt
          pip install pytest pytest-cov ruff mypy httpx

      - name: Run Ruff Linter
        run: |
          ruff check python_ai_engine/

      - name: Run Pytest with Coverage
        run: |
          pytest python_ai_engine/tests/ --cov=python_ai_engine --cov-report=xml
        env:
          PYTHONPATH: python_ai_engine

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  java-build-test:
    name: Java Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        run: |
          mvn -f java_core/pom.xml clean compile test -Dmaven.test.failure.ignore=false

  docker-build-push:
    name: Build and Push Docker Images
    needs: [python-lint-test, java-build-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Java Backend
        uses: docker/build-push-action@v5
        with:
          context: ./java_core
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hl-java-backend:latest

      - name: Build and push AI Engine
        uses: docker/build-push-action@v5
        with:
          context: ./python_ai_engine
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hl-ai-engine:latest
