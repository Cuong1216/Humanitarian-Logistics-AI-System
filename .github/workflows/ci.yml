name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest

    env:
      USE_MOCK_AI: "true"
      GEMINI_API_KEY: "mock"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_ai_engine/requirements.txt
          pip install pytest pytest-cov ruff mypy httpx

      - name: Run Ruff Linter
        run: |
          ruff check python_ai_engine/

      - name: Run Pytest with Coverage
        run: |
          pytest python_ai_engine/tests/ --cov=python_ai_engine --cov-report=xml
        env:
          PYTHONPATH: python_ai_engine

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  java-build-test:
    name: Java Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        run: |
          mvn -f java_core/pom.xml clean compile test -Dmaven.test.failure.ignore=false
