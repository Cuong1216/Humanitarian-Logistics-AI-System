<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Bản đồ điều phối cứu trợ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Centered on Vietnam initially
        var map = L.map('map').setView([14.0583, 108.2772], 6);

        // Load OSM tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var markers = [];
        var routeLine = null;

        function clearMap() {
            markers.forEach(function(m) { map.removeLayer(m); });
            markers = [];
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        function setRoute(startLat, startLng, destLat, destLng, startLabel, destLabel) {
            clearMap();

            // Add markers
            var startMarker = L.marker([startLat, startLng]).addTo(map).bindPopup("<b>Điểm cung ứng:</b> " + startLabel).openPopup();
            var destMarker = L.marker([destLat, destLng]).addTo(map).bindPopup("<b>Điểm cứu trợ:</b> " + destLabel);
            markers.push(startMarker, destMarker);

            // Fetch route from OSRM API (coordinates are in [lng, lat] format for OSRM query)
            var osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${destLng},${destLat}?overview=full&geometries=geojson`;

            fetch(osrmUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        var route = data.routes[0];
                        var coords = route.geometry.coordinates; // Array of [lng, lat]
                        
                        // Convert [lng, lat] coordinates to Leaflet [lat, lng] format
                        var latLngs = coords.map(function(c) {
                            return [c[1], c[0]];
                        });

                        // Draw path
                        routeLine = L.polyline(latLngs, {
                            color: '#2980b9',
                            weight: 5,
                            opacity: 0.85
                        }).addTo(map);

                        // Fit bounds to show the route
                        map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                    } else {
                        // Fallback straight line
                        drawFallbackLine(startLat, startLng, destLat, destLng);
                    }
                })
                .catch(err => {
                    console.log("OSRM Routing Error: " + err);
                    drawFallbackLine(startLat, startLng, destLat, destLng);
                });
        }

        function drawFallbackLine(startLat, startLng, destLat, destLng) {
            routeLine = L.polyline([[startLat, startLng], [destLat, destLng]], {
                color: '#c0392b',
                weight: 4,
                dashArray: '5, 10',
                opacity: 0.7
            }).addTo(map);
            
            var group = new L.featureGroup(markers);
            map.fitBounds(group.getBounds(), { padding: [50, 50] });
        }
    </script>
</body>
</html>
